<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eyes Protector - Official App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appBg: '#12121A',
            safeGreen: '#7BC9A5',
            warningYellow: '#E5B96A',
            dangerRed: '#E98282',
            mainText: '#E8E6EE',

</head>
<body class="bg-appBg text-mainText font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-safeGreen selection:text-appBg">

  <!-- Header -->
  <header class="p-6 max-w-6xl mx-auto w-full flex flex-wrap justify-between items-center gap-4 border-b border-secondaryText/10">
    <div class="flex items-center gap-3">

      <img src="app logo with title.png" alt="Eyes Protector Icon" class="w-10 h-10 rounded-xl border border-safeGreen/30 shadow-md object-cover" onerror="this.src='app_icon.jpeg'" />
      <h1 class="text-xl font-bold tracking-tight text-mainText">Eyes Protector</h1>
    </div>

    <div class="flex items-center gap-3">
      <!-- Social Media Icons (Header) -->
      <a href="https://www.facebook.com/hassan.jucob/" target="_blank" rel="noopener noreferrer" aria-label="Facebook" class="p-2 bg-slate-900 border border-secondaryText/20 rounded-xl text-secondaryText hover:text-safeGreen hover:border-safeGreen/40 transition">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      </a>
      <a href="https://www.instagram.com/_h.31.n" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="p-2 bg-slate-900 border border-secondaryText/20 rounded-xl text-secondaryText hover:text-safeGreen hover:border-safeGreen/40 transition">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      </a>

      <!-- Language Switcher Button -->
      <button id="lang-btn" onclick="toggleLanguage()" class="bg-slate-900 border border-secondaryText/30 text-mainText px-3 py-1.5 rounded-xl text-xs font-semibold hover:border-safeGreen transition">
        العربية
      </button>

      <!-- Download Counter -->
      <div class="bg-slate-900/90 border border-secondaryText/20 px-4 py-1.5 rounded-full text-xs font-mono text-secondaryText shadow-md">
        <span id="txt-counter">Downloads</span>: <span id="download-count" class="text-safeGreen font-bold">0</span>
      </div>
    </div>
  </header>

  <!-- Main Hero Section -->
  <main class="max-w-5xl mx-auto px-6 py-12 text-center my-auto">
    <!-- Center App Icon Header -->
    <div class="inline-block p-2 bg-slate-900 border border-safeGreen/30 rounded-3xl mb-6 shadow-2xl">
      <img src="app logo with title.png" alt="Eyes Protector" class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl object-cover" onerror="this.src='app_icon.jpeg'" />
    </div>

    <h2 id="txt-title" class="text-4xl sm:text-5xl font-extrabold text-mainText tracking-tight mb-4">
      Protect Your Vision Every Day
    </h2>
    <p id="txt-subtitle" class="text-secondaryText text-base sm:text-lg max-w-lg mx-auto mb-8 leading-relaxed">
      Smart distance alerts to prevent eye strain and maintain healthy screen viewing habits.
    </p>

    <!-- Direct Download Button -->
    <a 
      id="download-btn"
      href="https://github.com/hassanNaweid/Eyes-Protector/releases/download/v1.0.3/Eyes.Protector.v1.0.3.apk" 
      download 
      class="inline-flex items-center justify-center gap-3 bg-safeGreen hover:bg-safeGreen/90 text-appBg font-bold text-base sm:text-lg px-8 py-4 rounded-2xl shadow-xl shadow-safeGreen/10 transition duration-200 transform hover:-translate-y-0.5 active:translate-y-0 w-full sm:w-auto"
    >
      <svg class="w-6 h-6 text-appBg" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
      <span id="txt-download">Download Direct APK</span>
    </a>

    <!-- Status Indicators -->
    <div class="grid grid-cols-3 gap-3 max-w-md mx-auto mt-8 text-xs font-semibold">
      <div id="txt-status-safe" class="p-2.5 bg-slate-900/60 border border-safeGreen/30 rounded-xl text-safeGreen">
        Safe Distance
      </div>
      <div id="txt-status-warn" class="p-2.5 bg-slate-900/60 border border-warningYellow/30 rounded-xl text-warningYellow">
        Warning Alert
      </div>
      <div id="txt-status-danger" class="p-2.5 bg-slate-900/60 border border-dangerRed/30 rounded-xl text-dangerRed">
        Too Close
      </div>
    </div>

    <!-- Screenshots Showcase Grid -->
    <section class="mt-16 text-left">
      <h3 id="txt-screenshots" class="text-xl font-bold text-mainText mb-6 text-center">App Screenshots</h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        <div class="bg-slate-900/80 border border-secondaryText/20 p-2 rounded-2xl shadow-xl">
          <img src="Screenshot1.png" alt="Screenshot 1" class="rounded-xl w-full h-auto object-cover" onerror="this.src='screenshot1.jpg'" />
        </div>
        <div class="bg-slate-900/80 border border-secondaryText/20 p-2 rounded-2xl shadow-xl">
          <img src="screenshot2.png" alt="Screenshot 2" class="rounded-xl w-full h-auto object-cover" onerror="this.src='screenshot2.jpg'" />
        </div>
        <div class="bg-slate-900/80 border border-secondaryText/20 p-2 rounded-2xl shadow-xl">
          <img src="screenshot3.png" alt="Screenshot 3" class="rounded-xl w-full h-auto object-cover" onerror="this.src='screenshot3.jpg'" />
        </div>
        <div class="bg-slate-900/80 border border-secondaryText/20 p-2 rounded-2xl shadow-xl">
          <img src="screenshot14.png" alt="Screenshot 4" class="rounded-xl w-full h-auto object-cover" onerror="this.src='screenshot4.jpg'" />
        </div>
        <div class="bg-slate-900/80 border border-secondaryText/20 p-2 rounded-2xl shadow-xl">
          <img src="screenshot5.png" alt="Screenshot 5" class="rounded-xl w-full h-auto object-cover" onerror="this.src='screenshot5.jpg'" />
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="py-6 px-4 text-center text-xs text-secondaryText/60 border-t border-secondaryText/10 flex flex-col sm:flex-row items-center justify-between gap-4 max-w-6xl mx-auto w-full">
    <span id="txt-footer">© 2026 Eyes Protector. Developed by Hassan Naweid.</span>
    
    <!-- Footer Social Links -->
    <div class="flex items-center gap-4 text-secondaryText">
      <a href="https://www.facebook.com/hassan.jucob/" target="_blank" rel="noopener noreferrer" class="hover:text-safeGreen transition">Facebook</a>
      <span>•</span>
      <a href="https://www.instagram.com/_h.31.n/" target="_blank" rel="noopener noreferrer" class="hover:text-safeGreen transition">Instagram</a>
    </div>
  </footer>

<!-- Scripts: Language Switcher & CountAPI -->
  <script>
    // --- 1. LANGUAGE TRANSLATIONS ---
    let currentLang = 'en';
    const translations = {
      en: {
        title: "Protect Your Vision Every Day",
        subtitle: "Smart distance alerts to prevent eye strain and maintain healthy screen viewing habits.",
        download: "Download Direct APK",
        counter: "Downloads",
        safe: "Safe Distance",
        warn: "Warning Alert",
        danger: "Too Close",
        screenshots: "App Screenshots",
        footer: "© 2026 Eyes Protector. Developed by Hassan Naweid.",
        btn: "العربية",
        dir: "ltr"
      },
      ar: {
        title: "احمِ نظرك يومياً",
        subtitle: "تنبيهات مسافة ذكية لمنع إجهاد العين والحفاظ على عادات استخدام صحية للشاشة.",
        download: "تحميل ملف APK المباشر",
        counter: "التنزيلات",
        safe: "مسافة آمنة",
        warn: "تنبيه تحذيري",
        danger: "قريب جداً",
        screenshots: "لقطات الشاشة",
        footer: "© 2026 Eyes Protector. تم التطوير بواسطة Hassan Naweid.",
        btn: "English",
        dir: "rtl"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'ar' : 'en';
      const t = translations[currentLang];
      
      document.documentElement.dir = t.dir;
      document.getElementById('txt-title').innerText = t.title;
      document.getElementById('txt-subtitle').innerText = t.subtitle;
      document.getElementById('txt-download').innerText = t.download;
      document.getElementById('txt-counter').innerText = t.counter;
      document.getElementById('txt-status-safe').innerText = t.safe;
      document.getElementById('txt-status-warn').innerText = t.warn;
      document.getElementById('txt-status-danger').innerText = t.danger;
      document.getElementById('txt-screenshots').innerText = t.screenshots;
      document.getElementById('txt-footer').innerText = t.footer;
      document.getElementById('lang-btn').innerText = t.btn;

      const screenshotsSec = document.querySelector('section');
      screenshotsSec.className = currentLang === 'ar' ? 'mt-16 text-right' : 'mt-16 text-left';
    }

    // --- 2. RELIABLE COUNTAPI SCRIPT ---
    const namespace = "eyes_protector_app_hassan_2026";
    const key = "downloads";
    const countEl = document.getElementById("download-count");
    const downloadBtn = document.getElementById("download-btn");

    function updateDisplay(val) {
      countEl.innerText = val;
    }

    function initCounter() {
      let savedCount = parseInt(localStorage.getItem("ep_dl_val") || "0");
      updateDisplay(savedCount);

      // Read live server count
      fetch(`https://api.countapi.xyz/get/${namespace}/${key}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.value !== undefined) {
            let serverCount = data.value;
            let highest = Math.max(savedCount, serverCount);
            localStorage.setItem("ep_dl_val", highest);
            updateDisplay(highest);
          }
        })
        .catch(err => console.log("CountAPI Sync Error:", err));
    }

    downloadBtn.addEventListener("click", () => {
      // 1. Immediately increment local UI state
      let localCount = parseInt(localStorage.getItem("ep_dl_val") || "0") + 1;
      localStorage.setItem("ep_dl_val", localCount.toString());
      updateDisplay(localCount);

      // 2. Increment remote counter
      fetch(`https://api.countapi.xyz/hit/${namespace}/${key}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.value !== undefined) {
            let finalVal = Math.max(localCount, data.value);
            localStorage.setItem("ep_dl_val", finalVal);
            updateDisplay(finalVal);
          }
        })
        .catch(err => console.log("Increment Sync Error:", err));
    });

    initCounter();
  </script>
</body>
</html>
